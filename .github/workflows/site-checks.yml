name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # --- canonical root site (index.html, pages/, assets/style.css) -------------------
      - name: Rebuild the canonical root site
        run: python tools/build_dashboard.py
      - name: Fail if the canonical HTML is stale
        run: |
          if ! git diff --exit-code -- index.html pages assets/style.css; then
            echo "Generated site is stale. Run tools/build_dashboard.py and commit the result."
            exit 1
          fi
      - name: Canonical site gate
        run: python tools/verify_core_site.py

      # --- consolidated edition (site/) -------------------------------------------------
      - name: Rebuild the consolidated edition
        run: python tools/build_consolidated.py
      - name: Fail if the consolidated edition is stale
        run: |
          if ! git diff --exit-code -- site; then
            echo "Generated edition is stale. Run tools/build_consolidated.py and commit the result."
            exit 1
          fi
      - name: Consolidated edition gate
        run: python tools/verify_consolidated.py
      - name: Consolidated link banner on the root page
        run: |
          python tools/link_consolidated.py
          if ! git diff --exit-code -- index.html; then
            echo "Root page is missing the consolidated-edition banner. Run tools/link_consolidated.py."
            exit 1
          fi

      # --- repository-wide -----------------------------------------------------------------
      - name: Whole-repo audit
        run: python tools/audit_site.py
      - name: Preserved editions
        run: |
          python verify_site.py
          python tools/check_site.py
          python tools/verify_edition.py
