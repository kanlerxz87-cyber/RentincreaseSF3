name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/build_dashboard.py
      - run: git diff --exit-code -- index.html pages assets/style.css || (echo 'generated site is stale: run tools/build_dashboard.py'; exit 1)
      - run: python tools/audit_site.py
      - run: python tools/verify_core_site.py
      - run: python verify_site.py
      - run: python tools/check_site.py
      - run: python tools/verify_edition.py
