name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Privacy sweep (every tracked text file, generic detectors)
        run: python tools/privacy_scan.py
      - name: Rebuild the generated site
        run: python tools/build_dashboard.py
      - name: Fail if the committed HTML is stale
        run: |
          if ! git diff --exit-code -- index.html pages assets/style.css; then
            echo "Generated site is stale. Run tools/build_dashboard.py and commit the result."
            exit 1
          fi
      - name: Canonical site gate
        run: python tools/verify_core_site.py
      - name: Current-review regression checks
        run: python tools/verify_review_regressions.py
      - name: Whole-repo audit
        run: python tools/audit_site.py
      - name: Row-source audit (every table row on every page)
        run: python tools/row_source_audit.py
      - name: Preserved editions
        run: |
          python verify_site.py
          python tools/check_site.py
          python tools/verify_edition.py
          python tools/check_v2.py
