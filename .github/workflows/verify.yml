name: verify

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Calculation self-tests against the four official Rent Board worked examples
        run: python3 tools/calc.py

      - name: Rebuild the site
        run: python3 tools/build_site.py

      - name: Check every internal and external link
        run: python3 tools/check_links.py --json docs/verification/link-check.json

      - name: Confirm the committed site matches the generator output
        if: always()
        # pages/audit.html embeds the commit log and file sizes, so it is expected
        # to differ from the previously committed copy. Everything else must be
        # byte-identical, which proves no published figure was hand-edited.
        run: |
          echo "--- files that differ from the commit ---"
          git status --porcelain
          echo "--- diffstat (audit.html and the link report excluded) ---"
          git diff --stat -- . ':(exclude)pages/audit.html' ':(exclude)docs/verification/link-check.json'
          if ! git diff --quiet -- . ':(exclude)pages/audit.html' ':(exclude)docs/verification/link-check.json'; then
            CHANGED=$(git diff --name-only -- . ':(exclude)pages/audit.html' ':(exclude)docs/verification/link-check.json' | tr '\n' ' ')
            echo "--- first 120 lines of the diff ---"
            git diff -- . ':(exclude)pages/audit.html' ':(exclude)docs/verification/link-check.json' | head -120
            echo "::error title=Generated site out of date::$CHANGED"
            exit 1
          fi
          echo "Committed site matches generator output."

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: docs/verification/link-check.json
          if-no-files-found: ignore
